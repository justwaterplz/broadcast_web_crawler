1/\u003e③ 회사는 회원이 서비스 내에 게시한 게시물이 타인의 저작권, 프로그램 저작권 등을 침해하더라도 이에 대한 민,형사상의 책임을 부담하지 않으며, 만일 이를 이유로 회사가\u003c2/\u003e\u003c3\u003e \u003c/3\u003e타인으로부터 손해배상청구 등 이의 제기를 받은 경우 해당 회원은 그로 인해 발생한 모든 손해를 부담하여야 합니다.","web__help_operation_body_description_management":"① 회사는 회원이 게시한 서비스 내의 모든 내용물이 게시판 운영원칙에 위배된다고 판단할 경우 해당 게시자에게 사전 또는 사후 통보 없이 삭제할 수 있으며,\u003c0/\u003e\u003c1\u003e \u003c/1\u003e더불어 해당 회원에게는 그 경중에 따라 합당한 제재를 가할 수 있습니다.\u003c2/\u003e② 회사는 필요에 의해 서비스의 추가 생성과 삭제를 임의로 할 수 있으며, 또한 서비스에 저장된 자료에 대해 게재기간 또는 저장기간을 정할 수 있고,\u003c3/\u003e\u003c4\u003e \u003c/4\u003e이를 변경할 수 있습니다.\u003c5/\u003e③ 회사는 필요에 따라 회원이 게시한 게시물을 사전 통지 없이 편집, 이동할 수 있으며, 회원이 해지하거나 적법한 사유로 해지된 경우 해당 회원이 게시하였던\u003c6/\u003e\u003c7\u003e \u003c/7\u003e게시물을 삭제할 수 있습니다.","web__help_operation_body_description_socialOrder":"① 국가이념을 훼손하거나 국가의 정상적인 활동을 저해할 우려가 있는 경우\u003c0/\u003e② 사회질서를 부정하고 조롱하거나 미풍양속에 위반되는 내용의 정보를 유포하는 경우\u003c1/\u003e③ 인명경시 내용, 자살미화나 유도, 폭력성 내용 및 범죄, 비행행위를 찬미한 내용이나 기타 범죄적 행위에 결부된다고 인정되는 경우\u003c2/\u003e④ 불쾌감을 유발할 수 있는 과도한 욕설과 저속한 비어, 은어, 속어를 사용한 경우\u003c3/\u003e⑤ 수치심이나 혐오감 또는 폭행을 구체적으로 묘사하여 공포심을 일으키는 경우\u003c4/\u003e⑥ 허위 사실을 고의로 유포하여 이용자들간의 감정 대립을 조장하는 경우\u003c5/\u003e⑦ 특정 종교 교리를 비방, 왜곡하거나 조롱하는 경우\u003c6/\u003e⑧ 저주성 또는 미신 숭배 내용일 경우","web__help_operation_body_description_obscenity":"① 외설적인 내용으로 성적 수치심과 혐오감을 유발하고 일반인의 성 관념에 위배되는 경우\u003c0/\u003e② 남녀의 성기·음모·항문을 묘사하거나, 성행위 등을 표현하는 경우.\u003c1/\u003e③ 저속하거나 음란한 데이터, 소프트웨어, 음악, 사진, 그래픽, 비디오 등의 광고 내용을 담거나 음란사이트를 연결(링크)한 게시물\u003c2/\u003e④ 윤락행위를 알선하거나 성관계를 목적으로 하는 만남을 유도하는 경우","web__help_operation_body_description_privacy":"① 당사자의 허락 없이 개인정보(이름, 주민번호, 지역, 사진 등)를 등록한 경우\u003c0/\u003e② 특정인 또는 단체를 비방, 중상하여 명예를 손상시키거나 사생활을 부당하게 침해하는 경우","web__help_operation_body_description_copyrightInfringement":"① 저작권자의 동의 없이 자료를 불법 게시, 배포, 복제하는 경우\u003c0/\u003e② 저작권자의 권리에 해당하는 상표권, 의장권 등을 무단으로 침해하는 행위\u003c1/\u003e③ 저작권이 걸려 있는 소프트웨어 등을 동의 없이 무료로 다운로드 할 수 있게 하거나, 시리얼 넘버를 공유하는 행위\u003c2/\u003e④ 불법 와레즈 사이트를 소개 또는 권하거나 링크하는 행위","web__help_operation_body_description_advertising":"① 게시물 내용과 상관없이 상업적 이익을 위해 타사 사이트 링크를 포함하는 경우\u003c0/\u003e② 금전(사이버머니)거래를 통한 도박 행위를 하게 하거나, 조장하는 경우\u003c1/\u003e③ 불법적인 경품/복권을 강매 또는 판매하는 경우\u003c2/\u003e④ 특정 회사나 개인의 이익을 목적으로 상업적 내용을 게재한 경우\u003c3/\u003e⑤ 돈 버는 사이트 소개, 피라미드식 사기행위 등 허위사실이나 불법적인 내용을 게재할 경우","web__help_operation_body_description_spam":"① 게시물 내용과 상관없이 상업적 이익을 위해 타사 사이트 링크를 포함하는 경우\u003c0/\u003e② 금전(사이버머니)거래를 통한 도박 행위를 하게 하거나, 조장하는 경우\u003c1/\u003e③ 불법적인 경품/복권을 강매 또는 판매하는 경우\u003c2/\u003e④ 특정 회사나 개인의 이익을 목적으로 상업적 내용을 게재한 경우\u003c3/\u003e⑤ 돈 버는 사이트 소개, 피라미드식 사기행위 등 허위사실이나 불법적인 내용을 게재할 경우","web__help_operation_body_description_otherRestrictions":"① 회사 직원이나 게시판 담당자 등을 사칭하거나 타인의 명의를 도용한 경우\u003c0/\u003e② 서비스와 관련된 설비의 오동작이나 정보의 파괴 및 혼란을 유발시키는 소프트웨어 바이러스, 기타 다른 컴퓨터 코드, 파일, 프로그램을 포함하고 있는 경우\u003c1/\u003e③ 기타 관계 법령 및 회사의 지침 등에 위반된다고 판단되는 경우","web__help_operation_body_description_youthProtection":"① 성인을 대상으로 하는 내용이거나 선정적이고 폭력적인 내용으로 청소년에게 유해하다고 판단되는 내용의 게시물에 대해 이용자의 사전/사후 동의 없이 삭제하거나\u003c0/\u003e\u003c1\u003e합당한 제재를 가할 수 있습니다.\u003c/1\u003e\u003c2/\u003e② 성인인증이 필요한 게시물을 상습적으로 등록하는 경우 그 경중에 따라 합당한 제재를 가할 수 있습니다.","web__help_operation_body_description_userRestrictions":"① 운영 원칙 위반 적발 시 제한 조치 : 경고 및 서비스 이용정지를 그 경중에 따라 가할 수 있으며, 경고 및 이용정지 조치는 경우에 따라 유동적일 수 있습니다.\u003c0/\u003e② 특정 IP에서 운영원칙 위반 사례가 반복적으로 발생하는 경우 해당 IP 차단 제재를 적용할 수 있습니다.\u003c1/\u003e③ 게시물이 타인에게 막대한 피해를 입힌 경우 또는 관련 법규를 위반한 경우에는 사법 기관에 의뢰하여 별도의 제재조치를 취할 수도 있습니다.\u003c2/\u003e④ 온라인상에서 발생하는 민·형사상의 문제는 당사자간 해결을 원칙으로 합니다.\u003c3/\u003e⑤ 온라인상에서 상호비방으로 인한 분쟁이 발생하였을 때 회사는 이에 대하여 책임을 부담하지 않으며 해당 문제는 당사자간 해결을 원칙으로 합니다.\u003c4/\u003e⑥ 당사자의 개인정보를 허락 없이 등록하여 피해자가 사법기관에 가해자에 대한 처벌을 요청한 경우 회사는 적극적으로 수사에 협조하는 것을원칙으로 합니다.","web__help_regulation_body_description_introduction":"TVING은 누구나 자유롭게 이용할 수 있는 열린 공간입니다. 모든 사람이 안전하고 즐겁게 이용할 수 있도록 TVING의 서비스는 방송통신심의위원회의 \u003c0\u003e\u003c1\u003eSafeNet\u003c/1\u003e\u003c/0\u003e 기준 청소년 레벨을 적용합니다.","web__help_regulation_body_description_enforcement":"TVING의 운영원칙은 \u003c0\u003e\u003c1\u003e방송통신심의위원회\u003c/1\u003e\u003c/0\u003e의 정보통신에 관한 심의규정에 기반하여 이를 위반할 경우 \u003c2\u003e\u003c3\u003eTVING 서비스의 약관\u003c/3\u003e\u003c/2\u003e에 의거, 해당 게시물은 예고 없이 삭제되며 게시자는 아이디가 규제되어 서비스 이용에 제한을 받을 수 있습니다.","web__help_regulation_body_description_rightsInfringement":"\u003c0/\u003e 가. 저작권 침해\u003c1/\u003e \u003c2/\u003e 정당한 권한 없이 타인의 상표 또는 저작물 등을 사용, 유포하는 등 특허권, 상표권, 디자인권, 저작권 등 지적재산권을 침해하는 내용\u003c3/\u003e 허락 없이 다른 사람의 자료를 퍼오거나 링크하는 행위\u003c4/\u003e 불법 복제된 자료를 게시, 유포하거나 CD-key를 공유하는 행위\u003c5/\u003e 와레즈사이트를 소개, 권유하는 행위\u003c6/\u003e \u003c7/\u003e 나. 명예훼손 및 개인정보침해\u003c8/\u003e \u003c9/\u003e 전화번호, 주민번호, 실명 등의 개인정보를 포함하고 있어 피해가 우려되는 내용\u003c10/\u003e 타인의 사진, 영상 등을 무단으로 게재하여 사생활 및 인격권을 침해하는 내용\u003c11/\u003e 해당 내용의 사실여부와 상관없이 특정 단체나 개인을 비방, 음해하는 내용\u003c12/\u003e 욕설 및 저속한 표현으로 타인의 인격을 모독하거나 불쾌감을 주는 내용\u003c13/\u003e 기타 정당한 권한 없이 타인의 권리를 침해하는 내용\u003c14/\u003e","web__help_regulation_body_description_obscenity":"\u003c0/\u003e 과도한 신체노출 및 착의상태라도 남녀의 성기, 여성의 유두 등이 구체적으로 묘사되는 내용\u003c1/\u003e 자극적인 성적 은어 및 비속어를 사용하여 성행위의 방법 · 감정 · 음성 등을 구체적으로 묘사한 내용\u003c2/\u003e 극도로 선정적인 내용을 포함하는 일반, 예술작품\u003c3/\u003e 성폭력행위를 조장하거나 묘사 또는 미화하는 내용\u003c4/\u003e 아동 또는 청소년을 성적 유희의 대상으로 묘사하는 내용\u003c5/\u003e 성적대화 또는 유희의 대상을 찾거나 매개하는 내용\u003c6/\u003e 성매매 또는 유흥업소를 알선, 광고, 유도하는 내용\u003c7/\u003e 성인사이트, 유해정보로의 링크 또는 홍보행위\u003c8/\u003e 사회통념상 성적 수치심을 유발하거나 성윤리를 왜곡시켜 청소년의 올바른 성 정체성 확립에 해가 될 것으로 판단되는 내용\u003c9/\u003e","web__help_regulation_body_description_illegalContent":"\u003c0/\u003e 사회적 약자 또는 부모, 스승에 대한 폭력행위를 묘사하거나 미화한 내용\u003c1/\u003e 도박사이트 홍보 등 사행심을 조장하는 내용\u003c2/\u003e 불법대부업, 휴대폰대출 등을 홍보, 권유하는 내용\u003c3/\u003e 자살을 미화, 권유하거나 자살방법 등을 묘사하여 조장하는 내용\u003c4/\u003e 유해약물 등의 효능 및 제조방법 등을 구체적으로 기술하여 그 복용•제조 및 사용을 조장하거나 이를 매개하는 것\u003c5/\u003e 인체분비물, 오물, 시체 등을 구체적으로 묘사하여 혐오감을 불러일으키는 내용\u003c6/\u003e 과도한 문신, 낙인, 장신구 등으로 혐오감을 주는 내용\u003c7/\u003e 흉기 등을 사용하여 신체를 손상시키거나 수술장면 등을 지나치게 상세히 표현하여 혐오감을 주는 내용\u003c8/\u003e 사람 또는 동물에 대한 육체적. 정신적 학대를 표현 또는 미화, 조장하는 내용\u003c9/\u003e 과도한 욕설 등 저속한 언어 사용으로 불쾌감을 주는 내용\u003c10/\u003e 미신숭배 등 비과학적인 생활태도를 조장, 정당화하는 내용\u003c11/\u003e 합리적 이유 없이 성별, 종교, 장애, 연령, 사회적 신분, 인종, 지역, 직업 등을 차별하거나 이에 대한 편견을 조장 또는 비방 하는 내용\u003c12/\u003e 범죄행위를 미화, 조장하는 내용\u003c13/\u003e 역사적 사실을 왜곡하거나 국가와 사회존립의 기본체제를 훼손할 우려가 있는 것\u003c14/\u003e 기타 사회적 혼란을 야기할 우려가 있거나 현행법령에 위배되는 정보를 포함하는 내용","web__help_regulation_body_description_otherRestrictions":"\u003c0/\u003e 타인의 개인정보를 도용하거나 무단 수집하여 사용하는 경우\u003c1/\u003e 게시판 성격에 위해 되는 글을 올려 다른 회원의 서비스 이용에 방해가 되는 경우\u003c2/\u003e 도배 형식으로 글을 올려 다른 회원의 서비스 이용에 방해가 되는 경우\u003c3/\u003e 특정 단체, 개인의 영리를 위해 상업적인 내용을 홍보하는 경우\u003c4/\u003e 피라미드영업, 돈 버는 사이트 소개 및 가입을 권유하는 내용\u003c5/\u003e TVING의 운영진, 직원 또는 관계자를 사칭하는 경우\u003c6/\u003e TVING서비스에 위해를 가하거나 고의로 방해하는 경우\u003c7/\u003e 행운의 편지글, 저주글, 스팸글, 홍보글 등의 자료를 올리는 경우\u003c8/\u003e 주민등록 생성기, 카드 생성기, 아이템 생성기 등 불법자료를 올리는 경우\u003c9/\u003e 불법복제 또는 해킹 및 피싱행위를 조장하는 경우\u003c10/\u003e 다른 회원에게 피해를 줄 수 있는 바이러스, 악성코드 등을 유포하는 경우\u003c11/\u003e 도박, 와레즈 등의 불법사이트의 소개 및 링크\u003c12/\u003e","web__help_restoration_body_description_appeal":"관리자에 의해 게시물 또는 커뮤니티가 접근제한 되는 경우, 규제사유와 안내사항을 작성자 또는 커뮤니티 운영자에게 통보합니다.\u003c0/\u003e\u003c1/\u003e 규제사유에 대한 이의가 있거나, 관련법령에 다른 정당한 권리를 가지고 게시하는 경우에는 관련자료를 소명하여 이의제기하는 경우, 소명자료를 검토하여 정당한 게시사유가 있는 경우에는 접근제한을 해제하여, 게시물을 복원합니다.","web__help_restoration_body_description_deadline":"차단된 게시물 또는 커뮤니티에 대한 이의신청은 차단일로 부터 30일 이내에 접수하여야 합니다.","web__help_restoration_body_description_correction":"안내 메일을 통해, 시정 요청내용을 안내하여 드립니다. 메일을 확인 하신 후, 정해진 기간 내에 시정내용을 이행하여 주시기 바랍니다.","web__help_earlyTermination_body_description_definitionTitle":"1. 중도 해지란?","web__help_earlyTermination_body_description_definition":"- 티빙에서 구독한 이용권의 이용을 중단하고 즉시 해지하는 것을 말합니다.","web__help_earlyTermination_body_description_effect":"- 이용권 중도 해지 시, 이용권 이용이 즉시 중단되고 이용권도 즉시 해지되며, 이용 중인 회차의 미사용 기간에 대한 금액이 환불됩니다.","web__help_earlyTermination_body_description_methodTitle":"2. 중도 해지 방법","web__help_earlyTermination_body_description_webMethod":"- PC WEB : \u003c0\u003e\u003c1\u003ewww.tving.com\u003c/1\u003e\u003c2/\u003e\u003c/0\u003e \u003e 로그인 \u003e 고객센터 \u003e 고객문의 \u003e 문의 유형 [환불/해지 신청] 선택하여 접수","web__help_earlyTermination_body_description_appMethod":"- Mobile APP : TVING APP \u003e 로그인 \u003e MY \u003e 고객센터 \u003e 1:1 문의 \u003e 문의 유형 [환불/해지 신청] 선택하여 접수","web__help_earlyTermination_body_description_proration":"* 이용권 구매 후 7일이 경과하거나, 이용권의 시청 내역이 있는 경우에는 사용일 수만큼 차감(일할 계산) 후 환불됩니다.","web__help_earlyTermination_body_description_annualPrice":" (단, 연간 이용권의 경우는 할인 구매가가 아닌 12개월 정가 기준으로 차감됩니다)","web__help_earlyTermination_body_description_partnerRules":"* 통신사 등 제휴처 상품을 이용중인 경우 각 제휴처의 환불 규정을 따릅니다.","web__help_withdrawalSubscription_body_description_definitionTitle":"1. 청약 철회란?","web__help_withdrawalSubscription_body_description_definition":"- 티빙 이용권 구매 후 사용내역이 없는 경우 결제일로부터 7일 이내 청약을 철회하고 결제 취소 또는 전액 환불하는 것을 말합니다.","web__help_withdrawalSubscription_body_description_methodTitle":"2. 청약 철회 방법","web__help_withdrawalSubscription_body_description_webMethod":"- PC WEB : \u003c0\u003e\u003c1\u003ewww.tving.com\u003c/1\u003e\u003c2/\u003e\u003c/0\u003e \u003e 로그인 \u003e 고객센터 \u003e 고객문의 \u003e 문의 유형 [환불/해지 신청] 선택하여 접수","web__help_withdrawalSubscription_body_description_appMethod":"- Mobile APP : TVING APP \u003e 로그인 \u003e MY \u003e 고객센터 \u003e 1:1 문의 \u003e 문의 유형 [환불/해지 신청] 선택하여 접수","web__help_withdrawalSubscription_body_description_inAppRules":"* 구글/애플 인앱결제로 구독하신 이용권은 각 사의 환불 요청 방법을 확인해주시기 바랍니다.","web__help_withdrawalSubscription_body_description_googleMethod":"* 구글 : 플레이스토어 우측 상단 프로필 \u003e 고객센터 \u003e 도움말 검색에서 '환불' 검색 \u003e 'Google Play 환불 요청하기.'","web__help_withdrawalSubscription_body_description_appleMethod":"* 애플 :\u003c0\u003e\u003c1\u003ehttps://support.apple.com/ko-kr/118223\u003c/1\u003e\u003c2/\u003e\u003c/0\u003e","web__help_withdrawalSubscription_body_description_partnerRules":"* 통신사 등 제휴처 상품을 이용 중인 경우 각 제휴처로 문의가 필요합니다.","web__help_consentInfoComponent_consent_title":"개인정보 수집 및 이용 동의 안내","web__help_consentInfoComponent_consent_notice":"※ 개인정보 수집 및 이용 동의 안내를 반드시 읽고 동의해주세요.","web__help_consentInfoComponent_consent_collector":"- 수집 주체 : TVING"," 합한 광고를 제공합니다.","web__help_avod_standard_restrictedContent_title":"시청 제한 콘텐츠","web__help_avod_standard_restrictedContent_content":"시청 제한 콘텐츠 목록은 유동적이며 매일 한 번 업데이트됩니다.\nApple TV 콘텐츠는 프리미엄 이용권을 보유하셔야 시청이 가능하며, 해당 목록에는 표기되어 있지 않습니다.\n\n","web__help_avod_light_pageTitle_title":"티빙 라이트 이용권 안내","web__help_avod_light_introBenefits_content":"저렴한 요금으로 고품질의 혜택이 제공됩니다.","web__help_avod_light_introAdvertising_content":"시청 전, 시청 중 광고가 나올 수 있습니다.","web__help_avod_light_introRestricted_content":"Apple TV 등 일부 콘텐츠 이용이 제한될 수 있습니다.","web__help_avod_light_simultaneousDevices_title":"동시 시청 기기 대수","web__help_avod_light_simultaneousDevices_content":"최대 3대까지 동시 접속 시청이 가능합니다.","web__help_avod_light_profiles_title":"프로필 생성 가능 개수","web__help_avod_light_profiles_content":"최대 4개의 프로필을 생성할 수 있습니다.","web__help_avod_light_resolution_title":"최대 지원 화질","web__help_avod_light_resolution_content":"최대 1080p FHD 화질로 시청할 수 있습니다.","web__help_avod_light_devices_title":"지원 기기 및 기능","web__help_avod_light_devices_content":"모바일, 태블릿, PC, TV에서 시청이 가능하며, 크롬캐스트 기능이 제공되지 않습니다.\nPIP 기능은 라이브 채널에 한해 제공됩니다.","web__help_avod_light_services_title":"지원 서비스","web__help_avod_light_services_content":"Quick VOD 제공됩니다. 다운로드 서비스는 지원되지 않으며, 이용권 업그레이드를 통해 서비스를 이용하실 수 있습니다.","web__help_avod_light_availableContent_title":"시청 가능 콘텐츠","web__help_avod_light_availableContent_content":"Apple TV 등 일부 콘텐츠 이용이 제한될 수 있습니다.\n이용이 불가한 콘텐츠는 상세 화면에서 광고형 이용권 시청 제한 안내 되며, 이용권 업그레이드를 통해 해당 콘텐츠를 시청하실 수 있습니다.","web__help_avod_light_advertising_title":"광고 제공 방식","web__help_avod_light_advertising_content":"시청 전과 시청 중에 광고가 제공될 수 있습니다.\n콘텐츠 재생 시간에 따라 광고 노출 구간과 재생 시간이 달라질 수 있으며, 시간 당 최대 4분 정도의 광고가 노출될 수 있습니다.","web__help_avod_light_adControls_title":"광고 시청 기능","web__help_avod_light_adControls_content":"특정 시간 동안 광고 시청 이후 건너뛰기가 가능한 광고와 광고 시청이 끝나기 전까지 건너뛰기가 불가능한 광고가 있습니다.\n광고 시청 중에는 되감기, 빨리감기와 재생 속도 제어 기능을 지원하지 않습니다.\n플레이어 내 시청 탐색 막대 위에 광고가 제공되는 구간이 표시되나, 실시간 광고 제공 상황에 따라 해당 구간에 광고가 미 노출 될 수 있습니다.","web__help_avod_light_privacy_title":"광고 수집 정보","web__help_a
